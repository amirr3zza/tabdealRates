[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=1
LeftMouseUpAction=[!UpdateMeasure MeasureParent][!UpdateMeasure MeasureGoldParent][!UpdateMeter *][!Redraw]
ToolTipText="Click to refresh rates"

[Metadata]
Name=Market Rates
Author=Antigravity
Information=Displays live US Dollar, Euro, and Gold prices from Tabdeal API
Version=1.2.0
License=MIT

; =======================================================
; VARIABLES & STYLES
; =======================================================
[Variables]
FontName=Segoe UI
FontColorMain=255,255,255,240
FontColorSub=180,185,200,200
DollarColor=68,207,110,255
EuroColor=90,170,255,255
GoldColor=255,200,60,255
ChangeColor=150,155,170,220
BgColor=22,27,34,230
BorderColor=48,54,61,200
CardWidth=260
CardHeight=212

; =======================================================
; MEASURES (WebParser)
; =======================================================
; Parent measure fetches the full JSON from Tabdeal Currency API
[MeasureParent]
Measure=WebParser
Url=https://api-web.tabdeal.org/r/festival/get-asset-prices/?asset_type=currency
CodePage=65001
RegExp=(?si)^\[\{"price_title":".*?","last_price":"(.*?)","price_change":(.*?)\},\{"price_title":".*?","last_price":"(.*?)","price_change":(.*?)\}
UpdateRate=300

; USD (Dollar) Price
[MeasureDollarPrice]
Measure=WebParser
Url=[MeasureParent]
StringIndex=1
RegExpSubstitute=1
Substitute="(?<=\d)(?=(\d{3})+(?!\d))":",","^$":"---"

; USD (Dollar) 24h Change %
[MeasureDollarChange]
Measure=WebParser
Url=[MeasureParent]
StringIndex=2
Substitute="":"0"

; EUR (Euro) Price
[MeasureEuroPrice]
Measure=WebParser
Url=[MeasureParent]
StringIndex=3
RegExpSubstitute=1
Substitute="(?<=\d)(?=(\d{3})+(?!\d))":",","^$":"---"

; EUR (Euro) 24h Change %
[MeasureEuroChange]
Measure=WebParser
Url=[MeasureParent]
StringIndex=4
Substitute="":"0"

; Gold Parent measure fetches the full JSON from Tabdeal Gold API
[MeasureGoldParent]
Measure=WebParser
Url=https://api-web.tabdeal.org/r/festival/get-asset-prices/?asset_type=gold
CodePage=65001
RegExp=(?si)^\[\{"price_title":".*?","last_price":".*?","price_change":.*?\},\{"price_title":".*?","last_price":"(.*?)","price_change":(.*?)\}
UpdateRate=300

; Gold (18K) Price
[MeasureGoldPrice]
Measure=WebParser
Url=[MeasureGoldParent]
StringIndex=1
RegExpSubstitute=1
Substitute="(?<=\d)(?=(\d{3})+(?!\d))":",","^$":"---"

; Gold (18K) 24h Change %
[MeasureGoldChange]
Measure=WebParser
Url=[MeasureGoldParent]
StringIndex=2
Substitute="":"0"

; =======================================================
; METERS (UI Display)
; =======================================================

; Background Card
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#CardWidth#,#CardHeight#,12 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#

; Title
[MeterTitle]
Meter=String
X=18
Y=14
FontFace=#FontName#
FontSize=11
FontWeight=700
FontColor=#FontColorMain#
AntiAlias=1
Text="Live Rates"

[MeterSource]
Meter=String
X=(#CardWidth# - 18)
Y=16
StringAlign=Right
FontFace=#FontName#
FontSize=8
FontColor=#FontColorSub#
AntiAlias=1
Text="Tabdeal"

